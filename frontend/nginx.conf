server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: deep links like /items/42 resolve to index.html
    location / {
        try_files $uri /index.html;
    }

    # Immutable fingerprinted assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # Resolve at request time (Docker's embedded DNS) so nginx starts and
        # serves the SPA even while the backend service is down or not yet
        # created. In k8s, route /api at the Ingress instead of relying on this.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for SSE (/api/events): stream without buffering, and keep
        # the connection open far longer than the default 60s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
