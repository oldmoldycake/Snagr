# Enforces the conventional-commit PR titles this repo already uses
# (feat(backend): ..., fix(mocks): ...). Types only — scopes stay free-form to
# match history (oidc, mocks, charts, ...).
name: PR title

on:
  # Required by the action; safe here because PR code is never checked out.
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            style
            chore
            ci
            build
            perf
            revert
          requireScope: false
