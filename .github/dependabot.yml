# Weekly grouped dependency PRs, one per ecosystem. Note pip only bumps
# *pinned* lines — agent/ and vision/ are fully pinned; parts of backend/
# stay unpinned until its pip-freeze pass. The chore(deps) prefix keeps
# Dependabot titles passing the PR title lint.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      agent-python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /vision
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      vision-python:
        patterns: ["*"]
    ignore:
      # torch is deliberately pinned without the +cpu local tag (see
      # requirements.txt) — Dependabot reads 2.x.y+cpu from the extra index as
      # an upgrade and would pin a tag that doesn't resolve on arm64. Bump
      # torch by hand.
      - dependency-name: torch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
